              if ([[GeminiAssistantManager sharedManager] isTweakEnabled] && !isDeviceCurrentlyLocked()) {
                  [[GeminiAssistantManager sharedManager] triggerFromSystemHook];
                  return;
              }
              %orig;
          }
          %end

          %hook SBHomeHardwareButtonActions
          - (void)performLongPressActions {
              if ([[GeminiAssistantManager sharedManager] isTweakEnabled] && !isDeviceCurrentlyLocked()) {
