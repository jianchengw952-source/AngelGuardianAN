name: Build AngelGuardian v4.1.0

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-rootless-deb:
    name: Build AngelGuardian Rootless DEB
    runs-on: macos-latest

    steps:
      - name: 1. Checkout Source Code
        uses: actions/checkout@v4

      - name: 2. Install Build Dependencies
        run: |
          brew install ldid dpkg xz gnu-tar

      - name: 3. Setup Theos Environment
        run: |
          export THEOS=~/theos
          git clone --recursive https://github.com/theos/theos.git $THEOS
          echo "Xcode SDK Path:"
          xcrun --sdk iphoneos --show-sdk-path

      - name: 4. Set Permission
        run: |
          if [ -f "layout/DEBIAN/postinst" ]; then
            chmod 0755 layout/DEBIAN/postinst
          fi

      - name: 5. Compile arm64 + arm64e Rootless Package
        run: |
          export THEOS=~/theos
          export PATH="/opt/homebrew/bin:/usr/local/bin:$THEOS/bin:$PATH"
          make clean
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless messages=yes

      - name: 6. Upload DEB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AngelGuardian-v4.1.0-Deb
          path: packages/*.deb
          if-no-files-found: error