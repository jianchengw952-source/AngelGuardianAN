name: Build 守护天使AN v5.1.0 (True Live Audio & Video & Dynamic Top 5)

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Theos on macOS
        run: |
          brew install ldid xz
          git clone --recursive --depth=1 https://github.com/theos/theos.git $HOME/theos
          rm -rf $HOME/theos/sdks
          git clone --depth=1 https://github.com/theos/sdks.git $HOME/theos/sdks

      - name: Build Package
        run: |
          export THEOS=$HOME/theos
          chmod 0755 layout/DEBIAN/postinst || true
          make package FINALPACKAGE=1

      - name: Upload Compiled .deb
        uses: actions/upload-artifact@v4
        with:
          name: ShouHuTianShiAN-v5.1.0-arm64-Deb
          path: packages/*.deb
